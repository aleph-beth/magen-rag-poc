[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "magen-rag-poc"
version = "0.1.0"
description = "Local-first SOC RAG proof of concept"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "streamlit>=1.35",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "pandas>=2.2",
  "faiss-cpu>=1.8.0",
  "sentence-transformers>=3.0",
  "torch>=2.3",
  "python-docx>=1.1",
  "pypdf>=4.2",
  "beautifulsoup4>=4.12",
  "markdown>=3.6",
  "httpx>=0.27"
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
